<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8ee" />
    <meta
      name="description"
      content="Search routes, pick your seats, and get your tickets - ferry travel across the Philippines, all in one app."
    />
    <!-- The ship mark at 64px, 4.5 KB. The 156x96 source is padded to square
         before downscaling: squashing it into 64x64 would distort the mark.
         Declared alone on purpose — offering a webp alongside a PNG made
         Chrome fetch both, so the pair cost more than the single file. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/optimized/tripket-mark-64.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <title>Tripket PH — Online Ticket &amp; Cargo Booking in the Philippines</title>

    <!-- OpenGraph and Twitter, for link previews.

         The origin below is the deployment these tags describe, and it has to
         be the host actually serving this build. It previously read
         tripketph.com, which is a DIFFERENT site — that host answered
         /assets/og/tripket-og.jpg with its own HTML instead of the image, so
         every shared link showed a card with no picture.

         When this build takes over tripketph.com, change og:url and og:image
         here and SITE_URL in src/hooks/useDocumentMeta.js together. A test in
         src/security.test.js fails if they drift apart.
         These are STATIC on purpose. useDocumentMeta.js also sets og:title /
         description / url per route at runtime, which keeps the tab title and
         canonical link correct — but social crawlers (Facebook, LinkedIn, X,
         WhatsApp, iMessage, Slack, Discord) do not execute JavaScript. They
         read this file. So whatever is here is the preview every shared link
         gets, on every route, until the site is prerendered per route.

         og:image must be an absolute URL — a relative path silently produces
         no image. 1200x630 is the size every crawler expects. -->
    <meta property="og:site_name" content="Tripket PH" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_PH" />
    <meta property="og:url" content="https://tripket-p-hs.vercel.app/" />
    <meta
      property="og:title"
      content="Tripket PH — Online Ticket &amp; Cargo Booking in the Philippines"
    />
    <meta
      property="og:description"
      content="Search routes, pick your seats, and get your tickets - ferry travel across the Philippines, all in one app."
    />
    <meta property="og:image" content="https://tripket-p-hs.vercel.app/assets/og/tripket-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tripket PH — Where to next? Search routes, pick your seats, and get your tickets."
    />

    <!-- summary_large_image gives the full-width card rather than a thumbnail.
         X falls back to the og:* tags above for title, description and image. -->
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Applied before paint so a stored dark preference does not flash cream.
      try {
        var stored = localStorage.getItem('tripket-theme.v1')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
